[project]
name = "project-autonomous-agent"
version = "0.1.0"
description = "通用本地单用户 Project Autonomous Agent System"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "aiosqlite>=0.22.1",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "litellm>=1.102.0",
    "psutil>=5.9",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "reportlab>=5.1.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.28",
]
# 返修V3 批B-B4: GPT-Researcher 路线 A（可选——未装则方法论降级搜索+种子）
optional-research = [
    "gpt-researcher>=0.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic_migrations/versions/", "tmp/", "data/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_llm: allow live llm_complete (skip autouse stub in conftest)",
    "officecli_real: require real OfficeCLI binary (OFFICECLI_PATH); skipped by default",
]
